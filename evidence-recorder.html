<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- CRITICAL MOBILE META TAGS -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- iOS Video Playback Fixes -->
    <meta name="apple-mobile-web-app-title" content="Evidence Recorder">
    
    <title>Background Evidence Recorder</title>
    <style>
        /* MOBILE OPTIMIZED STYLING */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
        }
        
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            background: #000;
            opacity: 0.01;
            visibility: visible; /* Important for mobile */
            touch-action: none;
        }
        
        /* Hidden video element but properly sized for mobile */
        #videoPreview {
            position: absolute;
            top: 0;
            left: 0;
            width: 320px;
            height: 240px;
            object-fit: cover;
            transform: scaleX(-1);
            opacity: 0.001;
            visibility: visible;
            z-index: -9999;
            pointer-events: none;
        }
        
        /* Mobile status indicator */
        #statusIndicator {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(231, 76, 60, 0.9);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            z-index: 999999;
            display: block; /* Show for debugging */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        /* Debug console for mobile */
        #debugConsole {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: #0f0;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 11px;
            max-width: 90%;
            max-height: 200px;
            overflow: auto;
            z-index: 999999;
            display: block; /* Show for debugging */
            border: 1px solid #0f0;
        }
    </style>
</head>
<body>
    <!-- Video element with MOBILE ATTRIBUTES -->
    <video id="videoPreview" 
           autoplay 
           muted 
           playsinline 
           webkit-playsinline>
    </video>
    
    <!-- Status indicator -->
    <div id="statusIndicator">
        <span id="statusText">🔄 Initializing...</span>
        <span id="clipCount"> | Clips: 0</span>
    </div>
    
    <!-- Debug console -->
    <div id="debugConsole">
        <div>📱 Mobile Evidence Recorder</div>
        <div id="debugLog"></div>
    </div>

    <script>
        // ===== MOBILE DEBUG LOGGER =====
        function debugLog(message) {
            console.log('📱 Evidence Recorder:', message);
            const debugLog = document.getElementById('debugLog');
            if (debugLog) {
                const time = new Date().toLocaleTimeString();
                debugLog.innerHTML += `<div>[${time}] ${message}</div>`;
                debugLog.scrollTop = debugLog.scrollHeight;
            }
        }

        // ===== CONFIGURATION =====
        const CONFIG = {
            clipDuration: 5000,        // 5 seconds per clip
            autoStartDelay: 1000,      // 1 second delay before starting
            enableAudio: true,         // Record audio
            videoQuality: { 
                width: 640,            // Lower resolution for mobile
                height: 480,
                frameRate: 15,         // Lower FPS for mobile
                facingMode: 'environment' // Use back camera
            },
            maxClips: 100,
            storageKey: 'evidence_recorder_data'
        };

        // ===== STATE =====
        let cameraStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let clipCount = 0;
        let totalTime = 0;
        let recordingsData = [];
        let recorderActive = true;

        // ===== MESSAGE LISTENING =====
        // CRITICAL: Listen for messages from parent window
        window.addEventListener('message', async (event) => {
            debugLog(`Message received: ${event.data.type}`);
            
            try {
                switch (event.data.type) {
                    case 'startRecording':
                        debugLog('Start recording command');
                        await startRecording(event.data.config);
                        break;
                        
                    case 'stopRecording':
                        debugLog('Stop recording command');
                        stopRecording();
                        break;
                        
                    case 'MOBILE_HANDSHAKE':
                        debugLog('Handshake received');
                        // Send response back
                        window.parent.postMessage({
                            type: 'MOBILE_READY',
                            status: 'ready',
                            timestamp: Date.now()
                        }, '*');
                        break;
                        
                    case 'PING':
                        debugLog('Ping received');
                        window.parent.postMessage({
                            type: 'PONG',
                            timestamp: Date.now()
                        }, '*');
                        break;
                }
            } catch (error) {
                debugLog(`Error handling message: ${error.message}`);
            }
        });

        // ===== INITIALIZATION =====
        window.addEventListener('load', () => {
            debugLog('🚀 Evidence Recorder Loaded');
            updateStatus('Loading...');
            
            // Send ready message to parent
            setTimeout(() => {
                try {
                    window.parent.postMessage({
                        type: 'EVIDENCE_RECORDER_READY',
                        ready: true,
                        userAgent: navigator.userAgent,
                        isMobile: /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
                    }, '*');
                    debugLog('Ready message sent to parent');
                } catch (e) {
                    debugLog(`Failed to send ready: ${e.message}`);
                }
            }, 500);
            
            // Load saved data
            loadSavedData();
            
            // Try to start automatically (optional)
            setTimeout(() => {
                if (recorderActive) {
                    debugLog('Auto-initializing...');
                    initializeRecorder();
                }
            }, CONFIG.autoStartDelay);
        });

        // ===== CORE FUNCTIONS =====
        async function initializeRecorder() {
            try {
                updateStatus('Requesting camera...');
                debugLog('Requesting camera access...');
                
                // MOBILE-SPECIFIC CAMERA REQUEST
                const constraints = {
                    video: {
                        facingMode: CONFIG.videoQuality.facingMode,
                        width: { ideal: CONFIG.videoQuality.width },
                        height: { ideal: CONFIG.videoQuality.height },
                        frameRate: { ideal: CONFIG.videoQuality.frameRate }
                    },
                    audio: CONFIG.enableAudio
                };
                
                debugLog('Constraints: ' + JSON.stringify(constraints));
                
                cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
                
                debugLog('Camera access granted');
                updateStatus('Camera ready');
                
                // Set up video element
                const video = document.getElementById('videoPreview');
                video.srcObject = cameraStream;
                
                // CRITICAL for iOS: Play the video
                video.play().catch(e => {
                    debugLog(`Video play error: ${e.message}`);
                });
                
                // Start recording
                startRecordingLoop();
                
                // Save active state
                localStorage.setItem('recorder_active', 'true');
                
                // Notify parent
                window.parent.postMessage({
                    type: 'RECORDER_ACTIVE',
                    active: true
                }, '*');
                
            } catch (error) {
                debugLog(`Camera error: ${error.name} - ${error.message}`);
                updateStatus(`Camera error: ${error.name}`);
                
                // Send error to parent
                window.parent.postMessage({
                    type: 'RECORDER_ERROR',
                    error: error.message
                }, '*');
                
                // Retry after delay
                setTimeout(initializeRecorder, 5000);
            }
        }

        function startRecordingLoop() {
            if (!recorderActive || !cameraStream) {
                debugLog('Cannot start - not active or no stream');
                return;
            }
            
            updateStatus(`Recording clip ${clipCount + 1}`);
            debugLog(`Starting clip ${clipCount + 1}`);
            
            try {
                // Find supported mime type for MOBILE
                const mimeType = getSupportedMimeType();
                debugLog(`Using mime type: ${mimeType}`);
                
                // Create media recorder
                mediaRecorder = new MediaRecorder(cameraStream, {
                    mimeType: mimeType,
                    videoBitsPerSecond: 1500000 // Lower bitrate for mobile
                });
                
                recordedChunks = [];
                
                // Handle data
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data && event.data.size > 0) {
                        recordedChunks.push(event.data);
                        debugLog(`Chunk received: ${(event.data.size/1024).toFixed(2)}KB`);
                    }
                };
                
                // When recording stops
                mediaRecorder.onstop = () => {
                    debugLog('Recording stopped, saving...');
                    saveRecording();
                    
                    // Start next recording
                    if (recorderActive) {
                        setTimeout(startRecordingLoop, 300);
                    }
                };
                
                // Start recording
                mediaRecorder.start(CONFIG.clipDuration);
                isRecording = true;
                
                debugLog(`Recording started for ${CONFIG.clipDuration}ms`);
                
                // Auto-stop after clip duration (safety)
                setTimeout(() => {
                    if (mediaRecorder && isRecording) {
                        debugLog('Auto-stopping recording...');
                        mediaRecorder.stop();
                        isRecording = false;
                    }
                }, CONFIG.clipDuration + 1000);
                
            } catch (error) {
                debugLog(`Recording start error: ${error.message}`);
                updateStatus('Recording error');
                
                // Try again
                setTimeout(startRecordingLoop, 1000);
            }
        }

        function getSupportedMimeType() {
            // Check mobile-specific mime types
            const mimeTypes = [
                'video/webm;codecs=vp9,opus',
                'video/webm;codecs=vp8,opus',
                'video/webm;codecs=h264,opus',
                'video/webm',
                'video/mp4'
            ];
            
            for (let type of mimeTypes) {
                if (MediaRecorder.isTypeSupported(type)) {
                    debugLog(`Supported: ${type}`);
                    return type;
                }
            }
            
            // Default fallback
            return 'video/webm';
        }

        function saveRecording() {
            if (recordedChunks.length === 0) {
                debugLog('No chunks to save');
                return;
            }
            
            // Create blob
            const blob = new Blob(recordedChunks, { 
                type: mediaRecorder.mimeType || 'video/webm' 
            });
            
            // Generate filename
            const now = new Date();
            const timestamp = now.toISOString().replace(/[:.]/g, '-');
            const filename = `evidence_${timestamp}.webm`;
            
            // Create download link
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 100);
            
            // Update stats
            clipCount++;
            totalTime += CONFIG.clipDuration / 1000;
            
            // Save recording info
            recordingsData.unshift({
                id: Date.now(),
                filename: filename,
                size: blob.size,
                timestamp: timestamp,
                time: now.toLocaleTimeString(),
                date: now.toLocaleDateString()
            });
            
            // Limit clips
            if (recordingsData.length > CONFIG.maxClips) {
                recordingsData.pop();
            }
            
            // Update UI and save
            updateStatus();
            saveData();
            
            debugLog(`✅ Clip saved: ${filename} (${(blob.size/1024/1024).toFixed(2)}MB)`);
            
            // Notify parent
            window.parent.postMessage({
                type: 'CLIP_SAVED',
                clipCount: clipCount,
                filename: filename,
                size: blob.size
            }, '*');
        }

        function stopRecording() {
            debugLog('Stopping recording...');
            
            recorderActive = false;
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
            }
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
            }
            
            updateStatus('⏹ Stopped');
            
            window.parent.postMessage({
                type: 'RECORDER_STOPPED',
                clipCount: clipCount,
                totalTime: totalTime
            }, '*');
        }

        async function startRecording(config) {
            debugLog('Manual start recording called');
            
            if (config) {
                // Update config if provided
                Object.assign(CONFIG.videoQuality, config.video || {});
            }
            
            recorderActive = true;
            await initializeRecorder();
        }

        // ===== STATUS FUNCTIONS =====
        function updateStatus(message) {
            const statusEl = document.getElementById('statusText');
            const countEl = document.getElementById('clipCount');
            
            if (statusEl && countEl) {
                if (message) {
                    statusEl.textContent = `🔴 ${message}`;
                } else {
                    statusEl.textContent = `🔴 Clip ${clipCount + 1}`;
                }
                countEl.textContent = ` | Clips: ${clipCount}`;
            }
        }

        // ===== DATA MANAGEMENT =====
        function saveData() {
            try {
                const dataToSave = {
                    clipCount: clipCount,
                    totalTime: totalTime,
                    lastRecording: new Date().toISOString(),
                    recordings: recordingsData
                };
                
                localStorage.setItem(CONFIG.storageKey, JSON.stringify(dataToSave));
            } catch (error) {
                debugLog(`Save error: ${error.message}`);
            }
        }

        function loadSavedData() {
            try {
                const saved = localStorage.getItem(CONFIG.storageKey);
                if (saved) {
                    const data = JSON.parse(saved);
                    clipCount = data.clipCount || 0;
                    totalTime = data.totalTime || 0;
                    recordingsData = data.recordings || [];
                    updateStatus();
                    debugLog(`Loaded ${clipCount} previous clips`);
                }
            } catch (error) {
                debugLog('No previous data found');
            }
        }

        // ===== PUBLIC API =====
        window.EvidenceRecorder = {
            getStatus: () => ({
                isActive: recorderActive,
                clipCount: clipCount,
                totalTime: totalTime,
                isRecording: isRecording,
                lastClip: recordingsData[0] || null,
                userAgent: navigator.userAgent
            }),
            
            getRecordings: () => [...recordingsData],
            
            stop: () => {
                stopRecording();
                return 'Recorder stopped';
            },
            
            start: async (config) => {
                await startRecording(config);
                return 'Recorder started';
            },
            
            test: () => {
                debugLog('Test function called');
                return 'Recorder is working';
            }
        };

        // ===== ERROR HANDLING =====
        window.addEventListener('error', (event) => {
            debugLog(`Global error: ${event.message}`);
            updateStatus(`Error: ${event.message}`);
        });

        // ===== INITIAL LOG =====
        debugLog(`
        📱 MOBILE EVIDENCE RECORDER
        User Agent: ${navigator.userAgent}
        MediaRecorder: ${window.MediaRecorder ? 'Available' : 'Not Available'}
        Ready: ${new Date().toLocaleTimeString()}
        `);
    </script>
</body>
</html>
